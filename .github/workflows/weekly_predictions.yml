name: Weekly Predictions Update

on:
  schedule:
    # Tuesday 9 AM PT (5 PM UTC)
    - cron: '0 17 * * 2'
    # Sunday 9 AM PT (5 PM UTC) 
    - cron: '0 17 * * 0'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: weekly-predictions
  cancel-in-progress: false

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Refresh NFL stats data
        run: |
          python scripts/refresh_nfl_stats.py --seasons 2024 2025 2026
      
      - name: Train models (if not exist or weekly retrain)
        run: |
          # data/ml_models/ exists in git (metadata.json) but *.pkl are gitignored,
          # so check for actual model files, not just the directory.
          if ! ls data/ml_models/*.pkl >/dev/null 2>&1 || [ "$(date +%u)" -eq 2 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Training models..."
            python scripts/ml_train.py \
              --seasons 2018 2019 2020 2021 2022 2023 2024 2025 2026 \
              --train-seasons 2018 2019 2020 2021 2022 2023 \
              --val-seasons 2024
          else
            echo "Skipping model training (only Tuesdays or first run)"
          fi
          if ! ls data/ml_models/*.pkl >/dev/null 2>&1; then
            echo "::error::No trained models in data/ml_models after training step"
            exit 1
          fi
      
      - name: Generate predictions for current week
        run: |
          python scripts/predict_week_ml.py --lock
      
      - name: Export predictions to web format
        run: |
          # Get current season/week from nflverse
          SEASON=$(python -c "import nflreadpy; print(nflreadpy.get_current_season())")
          WEEK=$(python -c "import nflreadpy; print(nflreadpy.get_current_week())")
          python scripts/export_ml_predictions.py --season $SEASON --week $WEEK
          COUNT=$(python -c "import json; print(len(json.load(open('docs/data/latest_predictions.json'))))")
          echo "Exported $COUNT predictions for $SEASON week $WEEK"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::0 predictions exported - refusing to publish an empty board"
            exit 1
          fi
      
      - name: Export other web data
        run: |
          python scripts/export_web_data.py
      
      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update predictions $(date +'%Y-%m-%d %H:%M PT')"
            # refresh_nfl_stats.py rewrites tracked README.md and DATA_MANIFEST.md,
            # which sit outside data/ and docs/data/. Those unstaged edits make
            # `git pull --rebase` abort with "You have unstaged changes."
            # Park every leftover generated file, then autostash so a dirty
            # tree cannot fail the rebase. Do not commit README.md: the refresh
            # script rewrites it from a template and would clobber the curated file.
            if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
              echo "Stashing leftover generated files before rebase:"
              git status --short
              git stash push --include-untracked -m "weekly-predictions leftover generated files"
            fi
            # checkout uses fetch-depth 1; rebase needs the commits that landed
            # on the branch while this job was training.
            if [ -f "$(git rev-parse --git-path shallow)" ]; then
              git fetch --unshallow origin
            fi
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
